name: Generate SBE Rust Code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run generator
        run: |
          bash ./get-sbe-crate.sh generate

      - name: Commit generated code
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add generated
          git diff --cached --quiet || git commit -m "Update generated SBE code"

          git push
